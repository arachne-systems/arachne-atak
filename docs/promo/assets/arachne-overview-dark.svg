<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">ATAK on each phone; ARACHNE connects the team.</title><desc id="desc">Each phone runs ATAK for maps, chat and contacts, with an ARACHNE endpoint underneath. ARACHNE endpoints share locations, messages, map objects and files in a private workspace. Every network connection is encrypted. The devices are schematic illustrations, not application screenshots.</desc>
