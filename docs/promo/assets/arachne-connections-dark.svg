<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc">
<title id="title">Every ARACHNE connection is encrypted and authenticated.</title><desc id="desc">All three network paths are encrypted and authenticated: direct local Wi-Fi or LAN, a direct internet connection when possible, or a relay when a direct path is unavailable. A relay forwards encrypted traffic and cannot read the shared content. A usable path is required; internet and relay validation continues in the alpha.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="m1 1 4 2.5-4 2.5" fill="none" stroke="#8598aa" stroke-width="1.3"/></marker></defs>
